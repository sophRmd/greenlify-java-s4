#spring.datasource.password=<senha>
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O acesso ao banco é feito pelo ConnectionFactory (lê SPRING_DATASOURCE_* do ambiente).
# Valores padrão vazios evitam erro de placeholder ao subir sem as variáveis.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Redis (Sorted Set do ranking). Se estiver fora do ar, o sistema continua
# funcionando: o ranking cai para a consulta no Oracle.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=5s

server.port=${PORT:8080}